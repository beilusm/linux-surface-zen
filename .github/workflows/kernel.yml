name: Build Surface Zen
run-name: Surface Zen incremental build (${{ inputs.flavor }})

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Kernel configuration
        type: choice
        options: [pro7, full]
        default: pro7
      bootstrap_tag:
        description: Optional release containing the local cache export (first run)
        type: string
        default: ''
      build_minutes:
        description: Build time slice in minutes (1-270); checkpoint saved afterward
        type: string
        default: '240'

permissions:
  contents: write

concurrency:
  group: surface-zen-${{ github.ref }}-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SURFACE_ZEN_FLAVOR: ${{ inputs.flavor }}
      USE_CCACHE: '1'
      CCACHE_MAXSIZE: 20G
      BUILD_MINUTES: ${{ inputs.build_minutes }}
      BOOTSTRAP_TAG: ${{ inputs.bootstrap_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare disk and build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ $RUNNER_ENVIRONMENT == github-hosted ]]
          # Only disposable preinstalled SDKs on this GitHub VM, never project caches.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/powershell /opt/az
          df -h .
          free_kib=$(df -Pk . | awk 'NR==2 {print $4}')
          (( free_kib >= 50 * 1024 * 1024 )) || {
            echo 'At least 50 GiB of free disk is required for this DWARF/BTF kernel build.' >&2
            exit 1
          }
          source project.conf
          echo "profile=$default_profile" >> "$GITHUB_OUTPUT"
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"

      - name: Restore latest incremental checkpoint
        id: checkpoint
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/ci-checkpoints/output.tar.zst
          key: output-v1-${{ steps.identity.outputs.profile }}-${{ inputs.flavor }}-${{ hashFiles('project.conf', 'versions/**', 'configs/**', 'patches/**', 'scripts/**', 'ci/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            output-v1-${{ steps.identity.outputs.profile }}-${{ inputs.flavor }}-${{ hashFiles('project.conf', 'versions/**', 'configs/**', 'patches/**', 'scripts/**', 'ci/**') }}-

      - name: Import checkpoint or local progress
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s .cache/ci-checkpoints/output.tar.zst ]]; then
            zstd -dc .cache/ci-checkpoints/output.tar.zst | tar -xf - --no-same-owner
          elif [[ -n $BOOTSTRAP_TAG ]]; then
            mkdir -p .cache/bootstrap-download
            gh release download "$BOOTSTRAP_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'cache.tar.zst.part-*' --pattern SHA256SUMS \
              --pattern manifest.json --dir .cache/bootstrap-download
            (cd .cache/bootstrap-download && sha256sum -c SHA256SUMS)
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('.cache/bootstrap-download/manifest.json').read_text())
          expected=Path('project.conf').read_text().split('default_profile=')[1].splitlines()[0]
          assert d['schema']==1 and d['profile']==expected
          assert d['flavor']==os.environ['SURFACE_ZEN_FLAVOR']
          print('Importing cache from', d['project_path'], 'for', d['profile'])
          PY
            # Remove only consumed temporary transport copies; originals remain
            # in the seed release and on the user's machine.
            for part in .cache/bootstrap-download/cache.tar.zst.part-*; do
              cat "$part"
              rm -- "$part"
            done | zstd -d | tar -xf - --no-same-owner
          else
            echo 'No checkpoint or bootstrap provided; this run starts a new cloud build.'
          fi

      - name: Start Arch build container
        shell: bash
        run: |
          set -euo pipefail
          source ci/build.env
          docker run -d --name surface-zen-builder \
            --volume "$GITHUB_WORKSPACE:$container_project" \
            --workdir "$container_project" --env GITHUB_ACTIONS=true \
            --env SURFACE_ZEN_FLAVOR --env USE_CCACHE --env CCACHE_MAXSIZE \
            --env BUILD_MINUTES "$container_image" sleep infinity
          docker exec surface-zen-builder bash ci/container-setup.sh

      - name: Compile and package from existing output
        id: build
        continue-on-error: true
        shell: bash
        run: |
          docker exec --user '${{ steps.identity.outputs.uid }}' --env HOME=/home/builder \
            surface-zen-builder bash ci/build.sh

      - name: Verify kernel, modules, BTF and external module headers
        id: verify
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          docker exec --user '${{ steps.identity.outputs.uid }}' --env HOME=/home/builder \
            surface-zen-builder bash scripts/check-package.sh

      - name: Pack incremental checkpoint without private keys
        id: pack
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        shell: bash
        run: |
          docker exec --user '${{ steps.identity.outputs.uid }}' --env HOME=/home/builder \
            surface-zen-builder bash ci/checkpoint.sh

      - name: Save progress even after a timed out build
        if: always() && steps.pack.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/ci-checkpoints/output.tar.zst
          key: output-v1-${{ steps.identity.outputs.profile }}-${{ inputs.flavor }}-${{ hashFiles('project.conf', 'versions/**', 'configs/**', 'patches/**', 'scripts/**', 'ci/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish results without using Actions artifact storage
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        env:
          VERIFIED: ${{ steps.verify.outcome == 'success' }}
        run: bash ci/publish-results.sh

      - name: Report incomplete build
        if: always() && steps.build.outcome == 'failure'
        run: |
          echo 'Build incomplete. If the time slice expired, rerun this workflow to resume the saved checkpoint.'
          exit 1
