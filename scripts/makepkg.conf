# Host settings with generated files contained in this project.
source /etc/makepkg.conf
surface_project_root=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)
PKGDEST="$surface_project_root/artifacts/packages"
SRCDEST="$surface_project_root/.cache/downloads"
SRCPKGDEST="$surface_project_root/artifacts/packages"
LOGDEST="$surface_project_root/artifacts/logs"
BUILDDIR="$surface_project_root/work/packaging"
# Avoid the host's --ultra -20 / all-CPU compressor after a large kernel build.
COMPRESSZST=(zstd -c -T4 -6 -)
